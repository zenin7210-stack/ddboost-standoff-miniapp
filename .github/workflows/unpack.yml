name: Unpack Mini App ZIP

on:
  push:
    branches: [main]
    paths:
      - 'ARSLAN_BOOST_MiniApp_code.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Распаковать файлы
        run: |
          python - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path

          archive = Path("ARSLAN_BOOST_MiniApp_code.zip")
          with ZipFile(archive) as z:
              for item in z.infolist():
                  path = Path(item.filename)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"Небезопасный путь: {item.filename}")
                  z.extract(item, ".")
          PY

      - name: Сохранить распакованные файлы
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet || git commit -m "Распаковать файлы мини-приложения"
          git push
