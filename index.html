<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#050912">
<title>Arslan Boost | Standoff 2</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}
:root{color-scheme:dark}
body{
  --accent:#18a9ff;
  --accent-bg:#102441;
  --accent-glow:rgba(24,169,255,.18);
  margin:0;background:#050912;color:#f4f8ff;
  font:16px -apple-system,BlinkMacSystemFont,Arial,sans-serif;
  transition:border-color .16s ease;
}
body[data-mode="Сорев"]{
  --accent:#a875ff;--accent-bg:#241a3c;--accent-glow:rgba(168,117,255,.18);
}
body[data-mode="Дуэль"]{
  --accent:#16d4c3;--accent-bg:#10302e;--accent-glow:rgba(22,212,195,.18);
}
main{max-width:560px;margin:auto;padding:20px 17px 34px}
.hero{
  position:relative;overflow:hidden;padding:25px 21px;
  border:1px solid #183d68;border-radius:23px;
  background:
    linear-gradient(145deg,rgba(10,23,42,.92),rgba(5,9,18,.98)),
    #080e19;
  box-shadow:0 0 28px var(--accent-glow);
  transition:border-color .16s ease,box-shadow .16s ease;
}
.hero:before,.hero:after{
  content:"";position:absolute;height:2px;width:190px;
  background:linear-gradient(90deg,transparent,var(--accent),transparent);
  box-shadow:0 0 12px var(--accent);
  transform:rotate(-35deg);pointer-events:none;
}
.hero:before{top:24px;left:-70px}
.hero:after{right:-75px;bottom:28px}
.brand{font-size:13px;letter-spacing:4px;color:var(--accent);font-weight:800}
.hero h1{font-size:32px;letter-spacing:2px;margin:13px 0 7px}
.sub{color:#9cacc2;line-height:1.5}
h2{font-size:19px;margin:25px 0 12px}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
button,select,input{font:inherit}
.mode{
  min-height:54px;padding:10px 4px;border:1px solid #26364d;
  border-radius:13px;background:#0d1522;color:#c9d5e7;
  transition:background .16s ease,border-color .16s ease,
             color .16s ease,box-shadow .16s ease,transform .16s ease;
}
.mode:active{transform:scale(.98)}
.mode.active{
  color:#fff;border-color:var(--accent);background:var(--accent-bg);
  box-shadow:0 0 15px var(--accent-glow);
  animation:modeSelect .17s ease-out;
}
@keyframes modeSelect{
  from{transform:scale(.975);filter:brightness(1.16)}
  to{transform:scale(1);filter:brightness(1)}
}
.selected{
  min-height:20px;margin-top:9px;color:var(--accent);
  font-size:13px;transition:color .16s ease;
}
label{display:block;color:#aab9cd;font-size:14px;margin:16px 0 7px}
select,input{
  width:100%;padding:15px;border:1px solid #293950;border-radius:13px;
  background:#0d1522;color:#f4f8ff;outline:none;
}
select:focus,input:focus{
  border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow);
}
.card{
  margin-top:21px;padding:19px;border:1px solid #20334c;border-radius:17px;
  background:linear-gradient(145deg,#101a29,#0b111c);
  box-shadow:0 0 20px var(--accent-glow);
  transition:box-shadow .16s ease;
}
.row{display:flex;justify-content:space-between;gap:10px;color:#aab9cd}
#steps{text-align:right}
.total{font-size:34px;font-weight:850;color:#fff;margin-top:9px}
.breakdown{min-height:19px;margin-top:5px;color:var(--accent);font-size:13px;line-height:1.5}
.note{font-size:13px;color:#91a1b6;margin-top:10px;line-height:1.55}
.order{
  width:100%;margin-top:17px;padding:16px;border:0;border-radius:14px;
  background:linear-gradient(100deg,#086fc5,var(--accent));
  color:#fff;font-weight:750;box-shadow:0 5px 20px var(--accent-glow);
  transition:filter .15s ease,transform .15s ease;
}
.order:active{transform:scale(.99)}
.order:disabled{opacity:.42;box-shadow:none}
footer{text-align:center;color:#697a91;font-size:12px;margin-top:19px;letter-spacing:2px}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{animation:none!important;transition:none!important}
}
</style>
</head>
<body data-mode="Напы">
<main>
  <header class="hero">
    <div class="brand">ARSLAN BOOST</div>
    <h1>STANDOFF 2</h1>
    <div class="sub">Rank oshirish xizmati</div>
  </header>

  <h2>Rejimni tanlang</h2>
  <div class="modes">
    <button class="mode active" type="button" data-mode="Напы">Напы</button>
    <button class="mode" type="button" data-mode="Сорев">Сорев</button>
    <button class="mode" type="button" data-mode="Дуэль">Дуэль</button>
  </div>
  <div class="selected" id="selectedMode">Tanlangan rejim: Напы</div>

  <label for="current">Hozirgi rankingiz</label>
  <select id="current"></select>

  <label for="target">Maqsad rank</label>
  <select id="target"></select>

  <label for="player">O‘yin ID yoki nick</label>
  <input id="player" autocomplete="off" placeholder="Masalan: 12345678 yoki Player">

  <section class="card">
    <div class="row"><span>Buyurtma narxi</span><span id="steps">Ranklarni tanlang</span></div>
    <div class="total" id="price">0 so‘m</div>
    <div class="breakdown" id="breakdown"></div>
    <div class="note">
      Narx tanlangan ranklar bo‘yicha hisoblanadi. Buyurtma Telegram orqali
      administratorga yuboriladi. To‘lovni administrator bilan kelishasiz.
    </div>
    <button class="order" id="order" type="button" disabled>Buyurtma berish</button>
  </section>

  <footer>ARSLAN BOOST · STANDOFF 2</footer>
</main>

<script>
const ranks=[
  "Kalibrlash","Bronza","Kumush","Oltin","Feniks",
  "Reynjer","Chempion","Usta","Elita","Afsona"
];

// Narxlar: har bir keyingi rankka o‘tish
const prices=[3000,4000,6000,9000,13000,18000,25000,35000,50000];

const current=document.querySelector("#current");
const target=document.querySelector("#target");
const player=document.querySelector("#player");
const price=document.querySelector("#price");
const steps=document.querySelector("#steps");
const breakdown=document.querySelector("#breakdown");
const order=document.querySelector("#order");
const selectedMode=document.querySelector("#selectedMode");
let mode="Напы";

function fill(select){
  ranks.forEach((rank,i)=>{
    const option=document.createElement("option");
    option.value=i;
    option.textContent=rank;
    select.appendChild(option);
  });
}
fill(current);
fill(target);
current.value="0";
target.value="1";

function money(value){
  return new Intl.NumberFormat("uz-UZ").format(value)+" so‘m";
}

function update(){
  const from=Number(current.value);
  const to=Number(target.value);
  let sum=0;
  const parts=[];

  if(to>from){
    for(let i=from;i<to;i++){
      sum+=prices[i];
      parts.push(money(prices[i]));
    }
    steps.textContent=(to-from)+" ta bosqich";
    breakdown.textContent=parts.join(" + ")+" = "+money(sum);
  }else{
    steps.textContent="Yuqoriroq rankni tanlang";
    breakdown.textContent="";
  }

  price.textContent=money(sum);
  order.disabled=to<=from || !player.value.trim();
}

document.querySelectorAll(".mode").forEach(button=>{
  button.addEventListener("click",()=>{
    document.querySelectorAll(".mode").forEach(item=>item.classList.remove("active"));
    button.classList.add("active");
    mode=button.dataset.mode;
    document.body.dataset.mode=mode;
    selectedMode.textContent="Tanlangan rejim: "+mode;
  });
});

[current,target].forEach(item=>item.addEventListener("change",update));
player.addEventListener("input",update);

order.addEventListener("click",()=>{
  const from=Number(current.value);
  const to=Number(target.value);
  const message=
    "Assalomu alaykum! Arslan Boost orqali buyurtma bermoqchiman.\n"+
    "Rejim: "+mode+"\n"+
    "O‘yin ID yoki nick: "+player.value.trim()+"\n"+
    "Rank: "+ranks[from]+" → "+ranks[to]+"\n"+
    "Narxi: "+price.textContent;

  const url="https://t.me/theaxadov?text="+encodeURIComponent(message);
  if(window.Telegram?.WebApp) Telegram.WebApp.openTelegramLink(url);
  else window.location.href=url;
});

if(window.Telegram?.WebApp){
  Telegram.WebApp.ready();
  Telegram.WebApp.expand();
}
update();
</script>
</body>
</html>
